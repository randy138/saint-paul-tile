<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laundry &amp; Mud Room — 2464 S Saint Paul St</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#1c1e22;font-family:'Helvetica Neue',Arial,sans-serif;}
  #app{position:fixed;inset:0;}
  #hud{position:fixed;top:16px;left:16px;background:rgba(20,22,26,.82);color:#e8e8e6;
       padding:14px 18px;border-radius:10px;max-width:300px;backdrop-filter:blur(6px);
       border:1px solid rgba(255,255,255,.08);}
  #hud h1{font-size:15px;margin:0 0 2px;font-weight:600;letter-spacing:.3px;}
  #hud .sub{font-size:11px;color:#9aa0a8;margin-bottom:10px;}
  #hud ul{margin:0;padding:0;list-style:none;font-size:12px;line-height:1.7;color:#c9cdd3;}
  #hud ul b{color:#fff;font-weight:600;}
  #hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);
        color:#8b9099;font-size:12px;background:rgba(20,22,26,.7);padding:6px 14px;border-radius:20px;}
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <h1>Laundry &amp; Mud Room</h1>
  <div class="sub">2464 S Saint Paul St — 2nd Floor</div>
  <ul>
    <li><b>Room:</b> 167" × 112" (per cabinet plan)</li>
    <li><b>Floor:</b> 12" × 12" marble checkerboard (white / gray), 45° diagonal set</li>
    <li><b>Cabinets:</b> navy massing per IKEA design — sink run, W/D wall, mud lockers</li>
  </ul>
</div>
<div id="hint">Drag to orbit &nbsp;·&nbsp; Scroll / pinch to zoom</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
// world +x appears LEFT from default camera. sink run = left (x high). lockers = right (x=0).
const W=167, D=112, H=96;
const PX=6;

function makeCanvas(wIn,hIn){
  const c=document.createElement('canvas');
  c.width=Math.max(4,Math.round(wIn*PX));
  c.height=Math.max(4,Math.round(hIn*PX));
  return c;
}
function veins(ctx,x,y,w,h,count,alpha,rgb){
  for(let i=0;i<count;i++){
    ctx.beginPath();
    let vx=x+Math.random()*w, vy=y+Math.random()*h;
    ctx.moveTo(vx,vy);
    let ang=Math.random()*Math.PI*2;
    for(let s=0;s<4;s++){
      ang+=(Math.random()-0.5)*1.2;
      const len=(w+h)/8*(0.3+Math.random()*0.8);
      vx+=Math.cos(ang)*len; vy+=Math.sin(ang)*len;
      ctx.quadraticCurveTo(vx+(Math.random()-0.5)*8,vy+(Math.random()-0.5)*8,vx,vy);
    }
    ctx.strokeStyle='rgba('+rgb+','+(alpha*(0.4+Math.random()*0.6)).toFixed(3)+')';
    ctx.lineWidth=0.5+Math.random()*1.4;
    ctx.stroke();
  }
}
function finishTexture(c){
  const t=new THREE.CanvasTexture(c);
  t.encoding=THREE.sRGBEncoding; t.anisotropy=8;
  return t;
}
// 12x12 white/gray marble checkerboard drawn at 45 degrees
function diagCheckerCanvas(wIn,hIn){
  const c=makeCanvas(wIn,hIn), ctx=c.getContext('2d');
  ctx.fillStyle='#c6c6c6'; ctx.fillRect(0,0,c.width,c.height);
  const T=12*PX, G=1.2;
  ctx.save();
  ctx.translate(c.width/2,c.height/2);
  ctx.rotate(Math.PI/4);
  const ext=Math.ceil((wIn+hIn)/12);
  for(let i=-ext;i<=ext;i++){
    for(let j=-ext;j<=ext;j++){
      const x=i*T, y=j*T;
      const gray=((i+j)%2+2)%2===0;
      ctx.save();
      ctx.beginPath(); ctx.rect(x+G,y+G,T-2*G,T-2*G); ctx.clip();
      if(gray){
        const v=196+Math.floor(Math.random()*8)-3;
        ctx.fillStyle='rgb('+v+','+(v+2)+','+(v+4)+')';
        ctx.fillRect(x,y,T,T);
        veins(ctx,x,y,T,T,2,0.25,'240,243,245');
        veins(ctx,x,y,T,T,1,0.18,'150,155,160');
      }else{
        const v=245+Math.floor(Math.random()*7)-2;
        ctx.fillStyle='rgb('+v+','+v+','+(v+1)+')';
        ctx.fillRect(x,y,T,T);
        veins(ctx,x,y,T,T,2,0.16,'120,128,140');
      }
      ctx.restore();
    }
  }
  ctx.restore();
  return c;
}
function slabCanvas(wIn,hIn){
  const c=makeCanvas(wIn,hIn), ctx=c.getContext('2d');
  ctx.fillStyle='#f1f0ec'; ctx.fillRect(0,0,c.width,c.height);
  veins(ctx,0,0,c.width,c.height,7,0.2,'165,150,120');
  veins(ctx,0,0,c.width,c.height,4,0.15,'120,128,140');
  return c;
}

function texMat(canvas,rough){
  return new THREE.MeshStandardMaterial({map:finishTexture(canvas),roughness:rough,metalness:0.02});
}
const navy=new THREE.MeshStandardMaterial({color:0x2c3440,roughness:0.55});
const navyDark=new THREE.MeshStandardMaterial({color:0x232a35,roughness:0.6});
const wallMat=new THREE.MeshStandardMaterial({color:0xd9d4cc,roughness:0.9});
const whitePaint=new THREE.MeshStandardMaterial({color:0xf2f1ee,roughness:0.6});
const splashMat=new THREE.MeshStandardMaterial({color:0xdadad6,roughness:0.5});
const steel=new THREE.MeshStandardMaterial({color:0xb9bcc0,roughness:0.35,metalness:0.8});
const steelDark=new THREE.MeshStandardMaterial({color:0x3a3d42,roughness:0.4,metalness:0.6});
const chrome=new THREE.MeshStandardMaterial({color:0xd8dde2,roughness:0.18,metalness:0.95});
const stone=new THREE.MeshStandardMaterial({color:0xcfc9bd,roughness:0.85});

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x24262b);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
document.getElementById('app').appendChild(renderer.domElement);
const camera=new THREE.PerspectiveCamera(46,window.innerWidth/window.innerHeight,1,3000);

function box(w,h,d,mat,x,y,z){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z);
  m.castShadow=true; m.receiveShadow=true;
  scene.add(m); return m;
}

// floor
const floor=new THREE.Mesh(new THREE.PlaneGeometry(W,D),texMat(diagCheckerCanvas(W,D),0.35));
floor.rotation.x=-Math.PI/2;
floor.position.set(W/2,0.02,D/2);
floor.receiveShadow=true;
scene.add(floor);

// walls: left x=W, right x=0, back z=D
box(4,H,D+4,wallMat,W+2,H/2,D/2);
box(4,H,D+4,wallMat,-2,H/2,D/2);
box(W+8,H,4,wallMat,W/2,H/2,D+2);
const ceil=new THREE.Mesh(new THREE.PlaneGeometry(W+8,D+8),whitePaint);
ceil.rotation.x=Math.PI/2; ceil.position.set(W/2,H,D/2); scene.add(ceil);

// ---- back wall: W/D on pedestals + uppers + tall cabinet ----
const splash=box(56,60,1,splashMat,128,66,D-2.6); splash.castShadow=false;
[0,29].forEach((off,i)=>{
  const x0=100+off;
  box(28,12,26,navyDark,x0+14,6,D-16);                     // pedestal
  const m=box(27,38,27,steel,x0+14,12+19,D-16.5);          // machine
  const ring=new THREE.Mesh(new THREE.TorusGeometry(9,1.4,12,40),steelDark);
  ring.position.set(x0+14,32,D-16.5-13.8); scene.add(ring);
  const glass=new THREE.Mesh(new THREE.CircleGeometry(8.6,40),
    new THREE.MeshStandardMaterial({color:0x22252a,roughness:0.2,metalness:0.6}));
  glass.rotation.y=Math.PI; glass.position.set(x0+14,32,D-16.5-13.9); scene.add(glass);
});
box(58,28,13,navy,129,78,D-6.5);           // uppers over W/D
box(26,92,26,navy,87,46,D-13);             // tall cabinet right of W/D

// ---- left wall: sink run ----
box(24,34.5,86,navy,W-12,17.25,57);                         // bases z 14..100
const counter=new THREE.Mesh(new THREE.BoxGeometry(26,1.8,90),texMat(slabCanvas(30,92),0.25));
counter.position.set(W-13,35.4,57); counter.castShadow=true; counter.receiveShadow=true; scene.add(counter);
const splash2=box(1,56,88,splashMat,W-2.6,64,57); splash2.castShadow=false;
box(13,28,48,navy,W-6.5,78,36);                             // uppers (front half)
box(13,2,44,navy,W-6.5,60,82);                              // open shelf
// sink + faucet
box(16,1,14,steelDark,W-13,36.4,74);
const fz=74;
const riser=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.5,9,12),chrome);
riser.position.set(W-20,40.5,fz); scene.add(riser);
const arc=new THREE.Mesh(new THREE.TorusGeometry(3.4,0.5,10,24,Math.PI),chrome);
arc.rotation.y=Math.PI/2; arc.position.set(W-20,45,fz-3.4); scene.add(arc);
// stone step / dog wash at front-left
const step=box(26,13,26,stone,W-27,6.5,17);
const stepTop=new THREE.Mesh(new THREE.BoxGeometry(22,1,22),whitePaint);
stepTop.position.set(W-27,13.6,17); scene.add(stepTop);

// ---- right wall: mud lockers + door + window ----
box(20,12,48,navy,10,6,62);                                 // bench base z 38..86
const seat=new THREE.Mesh(new THREE.BoxGeometry(22,2,50),texMat(slabCanvas(26,54),0.25));
seat.position.set(11,13,62); seat.castShadow=true; seat.receiveShadow=true; scene.add(seat);
box(2,78,48,navy,1,53,62);                                  // back panel
box(20,26,48,navy,10,79,62);                                // uppers
[38,62,86].forEach(z=>box(2,52,2,navy,10,40,z));            // side/divider panels
// door (front of right wall)
box(2,82,32,whitePaint,1.5,41,20);
// window near back of right wall
box(1.5,38,26,whitePaint,1.2,60,97);
const pane=new THREE.Mesh(new THREE.PlaneGeometry(22,34),
  new THREE.MeshPhysicalMaterial({color:0xe8f1f6,transparent:true,opacity:0.4,roughness:0.05}));
pane.rotation.y=Math.PI/2; pane.position.set(2.1,60,97); scene.add(pane);

// door on left wall front (to garage)
box(2,82,32,whitePaint,W-1.5,41,20);

// lighting
scene.add(new THREE.HemisphereLight(0xf4f2ee,0x3a3c40,0.6));
const sun=new THREE.DirectionalLight(0xfff4e4,0.7);
sun.position.set(-60,190,-160);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-220; sun.shadow.camera.right=220;
sun.shadow.camera.top=220;  sun.shadow.camera.bottom=-80;
sun.shadow.camera.far=700;
sun.target.position.set(W/2,0,D/2); scene.add(sun.target);
scene.add(sun);
const inLight=new THREE.PointLight(0xfff1dd,0.5,420,2);
inLight.position.set(W/2,H-8,D/2-14);
inLight.castShadow=true; inLight.shadow.mapSize.set(1024,1024);
scene.add(inLight);
const fill=new THREE.PointLight(0xe8ecf2,0.3,500,2);
fill.position.set(W/2,60,-110); scene.add(fill);

// controls
const target=new THREE.Vector3(W/2,36,D/2-6);
let theta=-0.3, phi=1.18, radius=300;
let autoRotate=true, dragging=false, lastX=0, lastY=0, pinchDist=0;
function updateCamera(){
  phi=Math.max(0.18,Math.min(1.52,phi));
  radius=Math.max(90,Math.min(700,radius));
  camera.position.set(
    target.x+radius*Math.sin(phi)*Math.sin(theta),
    target.y+radius*Math.cos(phi),
    target.z-radius*Math.sin(phi)*Math.cos(theta)
  );
  camera.lookAt(target);
}
const el=renderer.domElement;
el.addEventListener('pointerdown',e=>{dragging=true;autoRotate=false;lastX=e.clientX;lastY=e.clientY;});
window.addEventListener('pointerup',()=>dragging=false);
window.addEventListener('pointermove',e=>{
  if(!dragging)return;
  theta+=(e.clientX-lastX)*0.0055;
  phi-=(e.clientY-lastY)*0.0045;
  lastX=e.clientX;lastY=e.clientY;
});
el.addEventListener('wheel',e=>{e.preventDefault();autoRotate=false;radius*=(1+Math.sign(e.deltaY)*0.08);},{passive:false});
el.addEventListener('touchstart',e=>{
  autoRotate=false;
  if(e.touches.length===2){
    pinchDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
  }
},{passive:true});
el.addEventListener('touchmove',e=>{
  if(e.touches.length===2){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    radius*=pinchDist/d; pinchDist=d;
  }
},{passive:true});
window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});
(function animate(){
  requestAnimationFrame(animate);
  if(autoRotate) theta+=0.0016;
  updateCamera();
  renderer.render(scene,camera);
})();
})();
</script>
</body>
</html>
